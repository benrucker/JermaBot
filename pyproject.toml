[project]
name = "jermabot"
version = "1.0.0"
description = "A Discord bot inspired by Jerma985, with an emphasis on adding sound functionality to your server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py[voice]>=2.7.1",
    "colorama",
    "pydub",
    "regex",
    "fuzzywuzzy",
    "claude-agent-sdk>=0.2.110",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# JermaBot is run as an app from the jerma/ directory, not installed as a package.
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# The bot runs as an app from jerma/, so tests import its modules the same
# way the bot does (cogs.utils.agent_service, not jerma.cogs...).
pythonpath = ["jerma"]
testpaths = ["tests"]
asyncio_mode = "auto"
