[project]
name = "jermabot"
version = "1.0.0"
description = "A Discord bot inspired by Jerma985, with an emphasis on adding sound functionality to your server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py[voice]>=2.7.1",
    "colorama",
    "pydub",
    "regex",
    "fuzzywuzzy",
    "claude-agent-sdk>=0.2.110",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# JermaBot is run as an app from the jerma/ directory, not installed as a package.
package = false
